[package]
name = "on-the-spectrum"
version = "0.1.0"
edition = "2024"

[dependencies]
# The UI only. The emulator core has no Bevy dependency and is not built with one, which
# is what keeps `cargo test` at seconds rather than minutes:
#
#     cargo run --release --features ui --bin zxbevy
# Bevy's own curated feature set for a 2D app — `bevy_sprite` is the component, and
# `bevy_sprite_render` (a separate crate since 0.17) is what actually draws it. Picking a
# feature list by hand gets you a window that renders nothing, silently.
bevy = { version = "0.19", optional = true, default-features = false, features = ["2d"] }
# The beeper needs somewhere to go. cpal is the audio device and nothing more.
cpal = { version = "0.18.2", optional = true }

# The menu reads the Internet Archive's JSON. Nothing else in the emulator parses any.
serde_json = { version = "1.0", optional = true }

[features]
default = []
ui = ["dep:bevy", "dep:cpal", "dep:serde_json"]

[[bin]]
name = "zxbevy"
required-features = ["ui"]

[dev-dependencies]
serde_json = "1.0.151"

# `cargo test` sweeps 1.6 million instruction vectors and parses 1.3 GB of JSON to do it.
# Unoptimised that is several minutes rather than several seconds, which is long enough
# that people stop running it. Debug assertions and symbols are kept, and `cargo build`
# is untouched.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
