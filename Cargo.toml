[package]
name = "on-the-spectrum"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
serde_json = "1.0.151"

# `cargo test` sweeps 1.6 million instruction vectors and parses 1.3 GB of JSON to do it.
# Unoptimised that is several minutes rather than several seconds, which is long enough
# that people stop running it. Debug assertions and symbols are kept, and `cargo build`
# is untouched.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
